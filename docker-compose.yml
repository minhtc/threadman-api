services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/game_db?sslmode=disable
      LEADERBOARD_TIMEZONE: ${LEADERBOARD_TIMEZONE:-UTC}
      SESSION_SECRET_ENCRYPTION_KEY: ${SESSION_SECRET_ENCRYPTION_KEY:?set SESSION_SECRET_ENCRYPTION_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
